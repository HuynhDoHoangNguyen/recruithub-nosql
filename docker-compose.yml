services:
  couchdb:
    image: couchdb:3.5.2.1
    container_name: recruithub-couchdb
    restart: unless-stopped

    ports:
      - "127.0.0.1:5984:5984"

    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}

    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:
